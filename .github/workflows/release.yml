name: Release
# Pushing a version tag (v1.0.0, ...) builds the Windows exe, the Linux tarball, the Android APK and the macOS app
# and attaches them to a GitHub Release. Nothing of Encarta is in any of them: players import their own disc.
#
# - The release's title is "MindMaze <version>" and its text is docs/release-notes/<tag>.md (same layout for every
#   release; copy the previous file). The workflow stops before building if that file is missing.
# - Every download gets a "<file>.sha256" next to it: the built-in updaters (src/platform/common/update.c, Android
#   UpdaterPlugin.java) refuse a download whose checksum differs.
# - The APK is signed with the app's fixed key (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; key kept outside the repository). Android installs an update only over
#   an app with the same key, so the release stops if the APK carries any other certificate.
# - The macOS app carries only an ad-hoc signature (what Apple Silicon needs to run it at all; no Apple ID, not
#   notarized).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # SHA-256 of the app's signing certificate (public: any copy of the APK shows it)
  APK_CERT_SHA256: "49:CB:E0:86:91:89:0C:F9:70:8E:23:9B:86:9B:77:61:6B:9D:D9:63:08:0E:BE:1C:54:70:01:08:CE:16:64:4D"

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release notes present
        run: test -s "docs/release-notes/${GITHUB_REF_NAME}.md" || { echo "::error::docs/release-notes/${GITHUB_REF_NAME}.md is missing"; exit 1; }
      - name: Install the compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make python3 gcc-mingw-w64-i686
      - name: No Encarta content in the repository
        run: python3 tools/check_no_content.py
      - name: Tests (synthetic data)
        run: make test
      - name: Windows build
        run: make win32 REPO_URL=https://github.com/${{ github.repository }} APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Web build (the engine of the Android app)
        run: make web REPO_URL=https://github.com/${{ github.repository }}
      - name: Linux tarball (SDL3, built in Ubuntu 22.04 so it runs on 22.04 and later)
        run: |
          docker build -t mindmaze-port-linux -f docker/linux.Dockerfile tools/
          docker run --rm -v "$PWD:/w" -w /w -u "$(id -u):$(id -g)" mindmaze-port-linux \
            make linux REPO_URL=https://github.com/${{ github.repository }} APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
      - name: Linux AppImage
        run: |
          curl -L --fail -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          make appimage APPIMAGETOOL=/tmp/appimagetool REPO_URL=https://github.com/${{ github.repository }} APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Android APK (signed with the app's fixed key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mindmaze-release.jks"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/mindmaze-release.jks"
          export APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          make android
          rm -f "$RUNNER_TEMP/mindmaze-release.jks"
      - name: The APK carries the app's certificate
        run: |
          got=$(keytool -printcert -jarfile build/android/MindMaze.apk | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d '\r')
          echo "APK certificate: $got"
          test "$got" = "$APK_CERT_SHA256" || { echo "::error::the APK is not signed with the app's key"; exit 1; }
      - name: Checksums for the updaters
        run: |
          for f in build/win32/MindMaze-*-windows-x86.zip build/linux/MindMaze-*-linux-x86_64.tar.gz build/linux/MindMaze-*-linux-x86_64.AppImage build/android/MindMaze.apk; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")" > "$(basename "$f").sha256")
          done
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MindMaze ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            build/win32/MindMaze-*-windows-x86.zip
            build/win32/MindMaze-*-windows-x86.zip.sha256
            build/linux/MindMaze-*-linux-x86_64.tar.gz
            build/linux/MindMaze-*-linux-x86_64.tar.gz.sha256
            build/linux/MindMaze-*-linux-x86_64.AppImage
            build/linux/MindMaze-*-linux-x86_64.AppImage.sha256
            build/android/MindMaze.apk
            build/android/MindMaze.apk.sha256

  # The macOS app is added to the same release afterwards (needs: release, so the two jobs never race to create it;
  # a failure here leaves the other downloads released).
  macos:
    needs: release
    runs-on: macos-15                  # macos-14 is retired ("configuration not supported", 2026-11-18)
    steps:
      - uses: actions/checkout@v4
      - name: SDL3 (static library, universal arm64 + x86_64)
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          sh tools/build_sdl3.sh build/sdl3-macos "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: MindMaze.app (universal, macOS 11 or later)
        run: |
          export PKG_CONFIG_PATH="$PWD/build/sdl3-macos/lib/pkgconfig" APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          make macos REPO_URL=https://github.com/${{ github.repository }}
          lipo -info build/macos/MindMaze.app/Contents/MacOS/MindMaze
          codesign --verify --deep --strict --verbose=2 build/macos/MindMaze.app
          cd build/macos
          file=$(echo MindMaze-*-macos-universal.zip)
          shasum -a 256 "$file" > "$file.sha256"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/MindMaze-*-macos-universal.zip
            build/macos/MindMaze-*-macos-universal.zip.sha256

  # Experimental compile check only: no signing, IPA or iOS release until it has been tested on a device.
  ios-simulator:
    needs: release
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: WebAssembly engine
        run: make web REPO_URL=https://github.com/${{ github.repository }}
      - name: Generate the experimental iOS project
        run: |
          rm -rf app/www app/ios
          mkdir -p app/www
          cp -R build/web/. app/www/
          cd app
          npm ci --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Unsigned iOS Simulator build
        run: |
          xcodebuild \
            -workspace app/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
