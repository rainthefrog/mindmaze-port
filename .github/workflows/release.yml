name: Release
# Pushing a version tag (v1.0.0, ...) builds the Windows exe and the Android APK and attaches them to a GitHub
# Release. Nothing of Encarta is in either file: players import their own disc.
# No release signing: the APK carries Android's automatic debug signature (Android installs only signed APKs). Each
# build's debug key differs, so a new version may need the old app uninstalled first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc make python3 gcc-mingw-w64-i686
      - name: No Encarta content in the repository
        run: python3 tools/check_no_content.py
      - name: Tests (synthetic data)
        run: make test
      - name: Windows exe
        run: make win32 REPO_URL=https://github.com/${{ github.repository }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Web build (the engine of the Android app)
        run: make web REPO_URL=https://github.com/${{ github.repository }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Android APK
        run: |
          export APP_VERSION_NAME="${GITHUB_REF_NAME#v}" APP_VERSION_CODE="${{ github.run_number }}"
          make android
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/win32/MindMaze.exe
            build/android/MindMaze.apk
